version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medassist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medassist_user
      POSTGRES_PASSWORD: medassist_secure_password
      POSTGRES_DB: medassist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist_user -d medassist_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medassist_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: medassist_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://medassist_user:medassist_secure_password@postgres:5432/medassist_db
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
      SECRET_KEY: ${SECRET_KEY:-medassist-prod-secret-key-32-chars-long-abc}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    ports:
      - "8000:8000"
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/chroma_db:/app/data/chroma_db

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: medassist_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
